name: Code Style

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codestyle:
    name: C++ Code Style Check
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Python dependencies
      run: |
        pip3 install --user pyyaml

    - name: Run C++ codestyle check
      id: codestyle
      run: |
        python3 /github/workspace/azerothcore/apps/codestyle/codestyle-cpp.py \
          --path /github/workspace/modules/mod-ah-injector/src

    - name: Check result
      if: failure()
      run: |
        echo "❌ Code style check failed"
        exit 1

    - name: Success
      if: success()
      run: |
        echo "✅ Code style check passed"